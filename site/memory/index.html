<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Memory</title>
  <meta name="theme-color" content="#f97316" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .bar { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 4px 16px 12px; }
    .bar .chip { background: var(--card); border: 2px solid var(--border); border-radius: 999px; padding: 8px 14px; font-weight: 700; }
    .bar button { font: inherit; font-weight: 700; border-radius: 999px; padding: 8px 14px; border: 2px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
    .bar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
    .grid { display: grid; gap: 10px; max-width: 560px; margin: 0 auto; padding: 0 12px 24px; }
    .card { aspect-ratio: 1; border: none; border-radius: 18px; font-size: clamp(2rem, 9vw, 3.4rem); cursor: pointer; background: var(--accent); color: transparent; box-shadow: inset 0 -5px 0 rgba(0,0,0,.18); transition: transform .15s; }
    .card.open, .card.done { background: var(--card); color: inherit; border: 3px solid var(--border); box-shadow: none; }
    .card.done { opacity: .55; }
    .card:active { transform: scale(.95); }
    .win { text-align: center; font-size: 1.4rem; font-weight: 800; padding: 8px 16px 0; min-height: 2em; }
  </style>
</head>
<body>
  <div class="top"><a class="back" href="/">← Games</a><h1>🐶 Memory</h1></div>
  <div class="bar">
    <button data-pairs="6" class="on">Easy</button>
    <button data-pairs="8">Medium</button>
    <button data-pairs="10">Hard</button>
    <span class="chip" id="moves">Moves: 0</span>
  </div>
  <p class="win" id="win" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
<script>
(() => {
  const ANIMALS = ["🐶", "🐱", "🐰", "🦊", "🐻", "🐼", "🐸", "🐵", "🐯", "🦁", "🐮", "🐷", "🐔", "🐙"];
  const grid = document.getElementById("grid");
  let pairs = 6, first = null, lock = false, moves = 0, found = 0;

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function newGame() {
    const picks = shuffle([...ANIMALS]).slice(0, pairs);
    const cards = shuffle([...picks, ...picks]);
    grid.style.gridTemplateColumns = `repeat(${pairs === 6 ? 3 : 4}, 1fr)`;
    grid.innerHTML = "";
    first = null; lock = false; moves = 0; found = 0;
    document.getElementById("moves").textContent = "Moves: 0";
    document.getElementById("win").textContent = "";
    cards.forEach((a) => {
      const b = document.createElement("button");
      b.className = "card"; b.textContent = a; b.dataset.animal = a; b.setAttribute("aria-label", "Hidden card");
      b.addEventListener("click", () => flip(b));
      grid.appendChild(b);
    });
  }

  function flip(b) {
    if (lock || b.classList.contains("open") || b.classList.contains("done")) return;
    b.classList.add("open"); b.setAttribute("aria-label", b.dataset.animal);
    if (!first) { first = b; return; }
    moves++; document.getElementById("moves").textContent = `Moves: ${moves}`;
    if (first.dataset.animal === b.dataset.animal) {
      first.classList.add("done"); b.classList.add("done"); first = null; found++;
      if (found === pairs) document.getElementById("win").textContent = `🎉 Well done! You found all pairs in ${moves} moves!`;
    } else {
      lock = true;
      const a = first; first = null;
      setTimeout(() => { [a, b].forEach((c) => { c.classList.remove("open"); c.setAttribute("aria-label", "Hidden card"); }); lock = false; }, 800);
    }
  }

  document.querySelectorAll("[data-pairs]").forEach((btn) => btn.addEventListener("click", () => {
    document.querySelectorAll("[data-pairs]").forEach((x) => x.classList.toggle("on", x === btn));
    pairs = Number(btn.dataset.pairs); newGame();
  }));
  newGame();
})();
</script>
</body>
</html>
