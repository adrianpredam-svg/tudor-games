<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Balloon Pop</title>
  <meta name="theme-color" content="#f97316" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
    .hud { display: flex; justify-content: center; gap: 10px; padding: 0 16px 8px; }
    .hud span { background: var(--card); border: 2px solid var(--border); border-radius: 999px; padding: 8px 14px; font-weight: 800; }
    #sky { position: fixed; left: 0; right: 0; bottom: 0; top: 120px; overflow: hidden; background: linear-gradient(#bae6fd, #e0f2fe); }
    @media (prefers-color-scheme: dark) { #sky { background: linear-gradient(#0c4a6e, #082f49); } }
    .balloon { position: absolute; width: 70px; height: 86px; border-radius: 50% 50% 48% 48%; cursor: pointer; border: none; padding: 0; touch-action: none; }
    .balloon::after { content: ""; position: absolute; left: 50%; top: 100%; width: 2px; height: 40px; background: rgba(0,0,0,.35); }
    .balloon::before { content: ""; position: absolute; left: 18%; top: 14%; width: 22%; height: 26%; border-radius: 50%; background: rgba(255,255,255,.5); }
    .pop { position: absolute; font-size: 2rem; pointer-events: none; animation: fade .5s forwards; }
    @keyframes fade { to { opacity: 0; transform: scale(1.8); } }
    .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 16px; }
    .center h2 { margin: 0; font-size: 2rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="top"><a class="back" href="/">← Games</a><h1>🎈 Balloon Pop</h1></div>
  <div class="hud"><span id="score">🎈 0</span><span id="time">⏱ 60</span></div>
  <div id="sky">
    <div class="center" id="menu">
      <h2>Pop the balloons!</h2>
      <p>Tap as many balloons as you can in 60 seconds.</p>
      <button class="btn" id="go">▶ Start</button>
      <p id="best"></p>
    </div>
  </div>
<script>
(() => {
  const sky = document.getElementById("sky");
  const COLORS = ["#ef4444", "#f59e0b", "#22c55e", "#3b82f6", "#a855f7", "#ec4899"];
  let score = 0, timeLeft = 60, running = false, spawnT = null, clockT = null, best = 0;
  try { best = Number(localStorage.getItem("balloons-best")) || 0; } catch {}
  let audio = null;
  function pop() { try { audio ??= new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 600 + Math.random() * 400; g.gain.value = 0.06; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.06); } catch {} }

  function spawn() {
    if (!running) return;
    const b = document.createElement("button");
    b.className = "balloon"; b.setAttribute("aria-label", "Balloon");
    b.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
    const w = sky.clientWidth, h = sky.clientHeight;
    b.style.left = `${Math.random() * (w - 80) + 5}px`;
    b.style.top = `${h + 10}px`;
    const speed = 50 + Math.random() * 60 + (60 - timeLeft) * 2; // px per second, faster later
    let y = h + 10, last = performance.now();
    b.addEventListener("pointerdown", (e) => {
      e.preventDefault(); if (!running) return;
      score++; document.getElementById("score").textContent = `🎈 ${score}`; pop();
      const p = document.createElement("span"); p.className = "pop"; p.textContent = "💥";
      p.style.left = b.style.left; p.style.top = `${y}px`; sky.appendChild(p); setTimeout(() => p.remove(), 500);
      b.remove();
    });
    sky.appendChild(b);
    (function rise(now) {
      if (!b.isConnected) return;
      y -= speed * (now - last) / 1000; last = now;
      b.style.top = `${y}px`;
      if (y < -140) return b.remove();
      requestAnimationFrame(rise);
    })(last);
    spawnT = setTimeout(spawn, Math.max(250, 800 - (60 - timeLeft) * 8));
  }

  function start() {
    score = 0; timeLeft = 60; running = true;
    document.getElementById("menu").classList.add("hidden");
    document.getElementById("score").textContent = "🎈 0";
    document.getElementById("time").textContent = "⏱ 60";
    spawn();
    clockT = setInterval(() => {
      timeLeft--; document.getElementById("time").textContent = `⏱ ${timeLeft}`;
      if (timeLeft <= 0) end();
    }, 1000);
  }
  function end() {
    running = false; clearInterval(clockT); clearTimeout(spawnT);
    sky.querySelectorAll(".balloon").forEach((b) => b.remove());
    if (score > best) { best = score; try { localStorage.setItem("balloons-best", String(best)); } catch {} }
    const m = document.getElementById("menu");
    m.querySelector("h2").textContent = `🎉 You popped ${score} balloons!`;
    m.querySelector("p").textContent = "Want to try again?";
    document.getElementById("go").textContent = "▶ Play again";
    showBest(); m.classList.remove("hidden");
  }
  function showBest() { document.getElementById("best").textContent = best ? `Best: ${best}` : ""; }
  document.getElementById("go").addEventListener("click", start);
  showBest();
})();
</script>
</body>
</html>
